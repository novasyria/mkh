<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NUQTH - الدخول</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#d4af37">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; connect-src https://ofylogxewabdiemaifep.supabase.co wss://ofylogxewabdiemaifep.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="NUQTH">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- الخط -->
    <link
        href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {

            background: #0b0b0b;

            color: white;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }

        .box {

            width: 100%;

            max-width: 400px;

            background: #151515;

            border: 1px solid #d4af37;

            border-radius: 20px;

            padding: 30px;

            text-align: center;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, .5);

        }

        .title {

            color: #d4af37;

            font-size: 28px;

            font-weight: 800;

            margin-bottom: 8px;

        }

        .sub {

            color: #888;

            font-size: 14px;

            margin-bottom: 25px;

        }

        .saved-project {

            background: #202020;

            border: 1px solid #333;

            border-radius: 12px;

            padding: 15px;

            margin-bottom: 15px;

            color: #ddd;

            font-size: 14px;

        }

        .saved-project strong {

            color: #d4af37;

            display: block;

            margin-top: 5px;

            font-size: 17px;

        }

        input {

            width: 100%;

            padding: 14px;

            background: #202020;

            color: white;

            border: 1px solid #333;

            border-radius: 12px;

            font-size: 18px;

            text-align: center;

            outline: none;

            margin-bottom: 15px;

        }

        input:focus {

            border-color: #d4af37;

        }

        button {

            width: 100%;

            padding: 13px;

            background: #d4af37;

            color: #111;

            border: none;

            border-radius: 12px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-bottom: 10px;

        }

        button:hover {

            background: #f0c542;

        }

        button:disabled {

            opacity: .6;

            cursor: not-allowed;

        }

        .change-button {

            background: #333;

            color: white;

        }

        .change-button:hover {

            background: #444;

        }

        .error {

            color: #ff7777;

            margin-top: 15px;

            font-size: 14px;

            min-height: 20px;

        }

        .loading {

            color: #d4af37;

        }

        .admin-link {

            display: block;

            margin-top: 18px;

            color: #8a8a8a;

            font-size: 12px;

            text-decoration: none;

            text-align: center;

        }

        .admin-link:hover {

            color: #d4af37;

        }

        .hidden {

            display: none !important;

        }

    </style>

</head>


<body>


<div class="box">


    <div class="title">
        <span dir="ltr">NUQTH<span aria-hidden="true" style="font-size:.5em;vertical-align:middle;">·</span></span>
    </div>


    <div
        id="subtitle"
        class="sub"
    >
        أدخل رمز الوصول الخاص بك
    </div>


    <!-- المشروع المحفوظ -->

    <div
        id="savedProject"
        class="saved-project hidden"
    >

        المشروع المحفوظ

        <strong id="savedProjectName">
            -
        </strong>

    </div>


    <!-- زر الدخول للمشروع المحفوظ -->

    <button
        id="goToSavedButton"
        class="hidden"
        type="button"
    >
        الدخول للمشروع
    </button>


    <!-- إدخال الرمز -->

    <div id="codeSection">

        <input
            type="text"
            id="accessCode"
            placeholder="أدخل الرمز هنا"
            autocomplete="off"
        >


        <button
            id="loginButton"
            type="button"
        >
            دخول
        </button>

    </div>


    <!-- تغيير المشروع --><button
        id="changeProjectButton"
        class="change-button hidden"
        type="button"
    >
        تغيير المشروع
    </button>


    <div
        id="errorMsg"
        class="error"
    ></div>


    <a
        class="admin-link"
        href="admin.html"
    >
        الإدارة العامة
    </a>


</div>


<script>


// =====================================
// SUPABASE
// =====================================

const db =
    window.supabase.createClient(

        "https://ofylogxewabdiemaifep.supabase.co",

        "sb_publishable_UzOHSK-Jk_5KVVu0TEcFxQ_bOjlAgFQ"

    );


// =====================================
// حد محاولات الدخول الخاطئة
// =====================================

// 5 محاولات خلال 10 دقائق ثم انتظار دقيقة
const FAIL_KEY = "k_login_fails";

function readFails() {
    try {
        const arr = JSON.parse(localStorage.getItem(FAIL_KEY) || "[]");
        const cut = Date.now() - 600000;
        return Array.isArray(arr)
            ? arr.filter(function (x) { return typeof x === "number" && x > cut; })
            : [];
    } catch (e) {
        return [];
    }
}

function lockSecondsLeft() {
    const f = readFails();
    if (f.length < 5) return 0;
    const left = Math.ceil((f[f.length - 1] + 60000 - Date.now()) / 1000);
    return left > 0 ? left : 0;
}

function recordFail() {
    const f = readFails();
    f.push(Date.now());
    try {
        localStorage.setItem(FAIL_KEY, JSON.stringify(f.slice(-10)));
    } catch (e) {}
}


let savedDestination = null;


// =====================================
// التخزين
// =====================================

const SAVED_DEST_KEY =
    "k_loyalty_saved_dest";


// رمز الدخول يُحفظ محلياً فقط لأصحاب الكاشير/الإدارة (لا يُرسل للعميل)
const ACCESS_CODE_KEY =
    "k_loyalty_access_code";


// =====================================
// عناصر الصفحة
// =====================================

const accessCode =
    document.getElementById(
        "accessCode"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const errorMsg =
    document.getElementById(
        "errorMsg"
    );


const savedProject =
    document.getElementById(
        "savedProject"
    );


const savedProjectName =
    document.getElementById(
        "savedProjectName"
    );


const changeProjectButton =
    document.getElementById(
        "changeProjectButton"
    );


const codeSection =
    document.getElementById(
        "codeSection"
    );


const subtitle =
    document.getElementById(
        "subtitle"
    );


// =====================================
// إظهار المشروع المحفوظ
// =====================================

async function loadSavedProject() {

    const savedDest =
        localStorage.getItem(
            SAVED_DEST_KEY
        );


    if (!savedDest) {

        return;

    }


    savedDestination =
        savedDest;


    // الإدارة العامة

    if (
        savedDest === "admin.html"
    ) {

        window.location.replace(
            savedDest
        );

        return;

    }


    if (
        !/^(client|cashier|owner)\.html\?project=/.test(savedDest)
    ) {

        localStorage.removeItem(
            SAVED_DEST_KEY
        );

        return;

    }


    try {

        // استخراج كود المشروع من الرابط

        const urlObj =
            new URL(
                savedDest,
                window.location.href
            );

        const savedCode =
            urlObj.searchParams.get(
                "project"
            ) || "";


        if (!savedCode) {

            localStorage.removeItem(
                SAVED_DEST_KEY
            );

            return;

        }


        const savedRole =
            savedDest.indexOf("cashier.html") === 0
                ? "cashier"
                : (savedDest.indexOf("owner.html") === 0
                    ? "admin"
                    : "client");


        let result;


        if (savedRole === "client") {

            // صفحة العميل تعمل بكود المشروع العام فقط
            const rpcResult =
                await db.rpc(
                    "client_store",
                    { p_store_code: savedCode }
                );


            const store =
                (rpcResult.data && rpcResult.data.ok)
                    ? rpcResult.data.store
                    : null;


            result = {
                data: store
                    ? {
                        store_code: store.store_code,
                        store_name: store.store_name,
                        is_active: store.is_active
                    }
                    : null,
                error: rpcResult.error || null
            };

        } else {

            // الكاشير والإدارة يحتاجان رمزاً سرياً محفوظاً من تسجيل الدخول
            const accessCode =
                localStorage.getItem(
                    ACCESS_CODE_KEY
                );


            if (!accessCode) {

                localStorage.removeItem(
                    SAVED_DEST_KEY
                );

                return;

            }


            const rpcResult =
                await db.rpc(
                    "app_login",
                    { p_code: accessCode }
                );


            const auth =
                rpcResult.data || {};


            const valid =
                auth.ok === true &&
                auth.role === savedRole &&
                auth.store_code === savedCode;


            result = {
                data: valid
                    ? {
                        store_code: auth.store_code,
                        store_name: auth.store_name,
                        is_active: true
                    }
                    : null,
                error: rpcResult.error || null
            };

        }


        if (result.error) {

            throw result.error;

        }


        if (!result.data) {

            localStorage.removeItem(
                SAVED_DEST_KEY
            );

            return;

        }


        const store =
            result.data;


        // المشروع متوقف

        if (
            store.is_active !== true
        ) {

            localStorage.removeItem(
                SAVED_DEST_KEY
            );

            errorMsg.textContent =
                "المشروع المحفوظ متوقف حالياً.";

            return;

        }


        window.location.replace(
            savedDest
        );

    } catch (error) {

        console.error(
            "Saved project validation error:",
            error
        );

        errorMsg.textContent =
            "تعذر التحقق من المشروع المحفوظ. تحقق من اتصال الإنترنت وحاول مجدداً.";

    }

}


// =====================================
// الدخول
// =====================================

async function login() {

    const code =
        accessCode.value.trim();


    errorMsg.textContent = "";


    if (!code) {

        errorMsg.textContent =
            "يرجى إدخال الرمز أولاً";

        return;

    }


    // =================================
    // حد محاولات الدخول الخاطئة
    // =================================

    const waitSec = lockSecondsLeft();

    if (waitSec > 0) {

        errorMsg.textContent =
            "محاولات خاطئة كثيرة. حاول بعد " + waitSec + " ثانية.";

        return;

    }


    // ملاحظة: رمز الإدارة العامة لم يعد يُتحقق منه هنا.
    // الإدارة العامة تُفتح مباشرة من admin.html ويُطلب الرمز هناك.
    loginButton.disabled =
        true;


    loginButton.textContent =
        "جاري التحقق...";


    try {


        // =================================
        // 1 - الكاشير
        // =================================

        const loginResult =
            await db.rpc(
                "app_login",
                { p_code: code }
            );


        if (loginResult.error) {

            throw loginResult.error;

        }


        const auth =
            loginResult.data || {};


        if (auth.ok !== true) {

            if (auth.error === "too_many") {

                errorMsg.textContent =
                    "محاولات كثيرة. حاول بعد قليل.";

                return;

            }


            if (auth.error === "inactive") {

                errorMsg.textContent =
                    "هذا المشروع متوقف حالياً.";

                return;

            }

        }


        const cashierResult = {
            data: (auth.ok === true && auth.role === "cashier")
                ? {
                    id: 0,
                    store_code: auth.store_code,
                    is_active: true
                }
                : null,
            error: null
        };


        if (cashierResult.data) {

            const store =
                cashierResult.data;


            if (
                store.is_active !== true
            ) {

                errorMsg.textContent =
                    "هذا المشروع متوقف حالياً.";

                return;

            }


            // نحفظ رمز الكاشير سرياً لاستخدامه في طلبات السيرفر
            localStorage.setItem(
                ACCESS_CODE_KEY,
                code
            );


            window.location.href =
                "cashier.html?project=" +
                encodeURIComponent(
                    store.store_code
                );

            localStorage.setItem(
                SAVED_DEST_KEY,
                "cashier.html?project=" +
                encodeURIComponent(
                    store.store_code
                )
            );


            return;

        }


        // =================================
        // 2 - إدارة المشروع
        // =================================

        const adminResult = {
            data: (auth.ok === true && auth.role === "admin")
                ? {
                    id: 0,
                    store_code: auth.store_code,
                    is_active: true
                }
                : null,
            error: null
        };


        if (adminResult.data) {

            const store =
                adminResult.data;


            if (
                store.is_active !== true
            ) {

                errorMsg.textContent =
                    "هذا المشروع متوقف حالياً.";

                return;

            }


            // نحفظ رمز الإدارة سرياً لاستخدامه في طلبات السيرفر
            localStorage.setItem(
                ACCESS_CODE_KEY,
                code
            );


            window.location.href =
                "owner.html?project=" +
                encodeURIComponent(
                    store.store_code
                );

            localStorage.setItem(
                SAVED_DEST_KEY,
                "owner.html?project=" +
                encodeURIComponent(
                    store.store_code
                )
            );


            return;

        }


        // =================================
        // 3 - العميل
        // =================================

        const clientResult = {
            data: (auth.ok === true && auth.role === "client")
                ? {
                    id: 0,
                    store_code: auth.store_code,
                    store_name: auth.store_name,
                    is_active: true
                }
                : null,
            error: null
        };


        if (clientResult.data) {

            const store =
                clientResult.data;


            if (
                store.is_active !== true
            ) {

                errorMsg.textContent =
                    "هذا المشروع متوقف حالياً.";

                return;

            }


            // =================================
            // حفظ المشروع على الجهاز
            // =================================

            const destURL =
                "client.html?project=" +
                encodeURIComponent(
                    store.store_code
                );

            localStorage.removeItem(
                ACCESS_CODE_KEY
            );


            localStorage.setItem(
                SAVED_DEST_KEY,
                destURL
            );


            // فتح صفحة العميل
            // نرسل store_code وليس code_client

            window.location.href =
                destURL;


            return;

        }


        // =================================
        // الرمز غير موجود
        // =================================

        recordFail();


        errorMsg.textContent =
            "الرمز المدخل غير صحيح.";


    } catch (error) {

        console.error(
            "Login Error:",
            error
        );


        errorMsg.textContent =
            "حدث خطأ أثناء التحقق من الرمز.";

    } finally {

        loginButton.disabled =
            false;

        loginButton.textContent =
            "دخول";

    }

}// =====================================
// تغيير المشروع
// =====================================

changeProjectButton.onclick =
    function() {

        localStorage.removeItem(
            SAVED_DEST_KEY
        );

        localStorage.removeItem(
            ACCESS_CODE_KEY
        );

        savedDestination =
            null;


        savedProject.classList.add(
            "hidden"
        );


        changeProjectButton.classList.add(
            "hidden"
        );


        document.getElementById(
            "goToSavedButton"
        ).classList.add(
            "hidden"
        );


        codeSection.classList.remove(
            "hidden"
        );


        subtitle.textContent =
            "أدخل رمز المشروع الجديد";


        accessCode.value =
            "";


        errorMsg.textContent =
            "";


        accessCode.focus();

    };


// =====================================
// زر الدخول للمشروع المحفوظ
// =====================================

document.getElementById(
    "goToSavedButton"
).onclick =
    function() {

        if (savedDestination) {

            window.location.href =
                savedDestination;

        }

    };


// =====================================
// زر الدخول
// =====================================

loginButton.onclick =
    login;


// =====================================
// Enter
// =====================================

accessCode.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            login();

        }

    }
);


// =====================================
// تشغيل الصفحة
// =====================================

loadSavedProject();


// =====================================
// Service Worker (PWA + أوفلاين)
// =====================================

if ("serviceWorker" in navigator) {

    window.addEventListener("load", function() {

        navigator.serviceWorker
            .register("sw.js")
            .catch(function() {});

    });

}

</script>


</body>

</html>
