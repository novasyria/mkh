name: Supabase Restore from Backblaze B2

on:
  workflow_dispatch:
    inputs:
      backup_date:
        description: 'اكتب التاريخ الذي تريد العودة إليه بصيغة YYYYMMDD (مثال: 20261109)'
        required: true

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
    - name: Install PostgreSQL Client
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client

    - name: Install AWS CLI Official
      run: |
        curl "https://amazonaws.com" -o "awscliv2.zip"
        unzip awscliv2.zip
        sudo ./aws/install --update

    - name: Configure AWS CLI for Backblaze B2
      run: |
        aws configure set aws_access_key_id ${{ secrets.B2_KEY_ID }}
        aws configure set aws_secret_access_key ${{ secrets.B2_APPLICATION_KEY }}
        aws configure set default.region us-east-1

    - name: Find and Download Backup File by Date
      run: |
        FILENAME=$(aws s3 ls s3://${{ secrets.B2_BUCKET_NAME }} --endpoint-url https://${{ secrets.B2_ENDPOINT }} | grep "${{ github.event.inputs.backup_date }}" | awk '{print $4}' | head -n 1)
        
        if [ -z "$FILENAME" ]; then
          echo "خطأ: لم يتم العثور على أي ملف نسخة احتياطية لهذا التاريخ في حساب Backblaze!"
          exit 1
        fi
        
        echo "تم العثور على الملف: $FILENAME"
        aws s3 cp s3://${{ secrets.B2_BUCKET_NAME }}/$FILENAME backup.dump --endpoint-url https://${{ secrets.B2_ENDPOINT }}

    - name: Run pg_restore to Supabase
      run: |
        pg_restore --clean --no-owner --no-privileges -d "${{ secrets.SUPABASE_DB_URL }}" backup.dump
        
