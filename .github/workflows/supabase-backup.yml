name: Supabase Backup

on:
  schedule:
    - cron: '0 2 * * *'   # كل يوم 2 الصبح UTC
  workflow_dispatch:       # لتشغيله يدوي للتجربة

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges -F c -f backup.dump

      - name: Upload to Backblaze B2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: us-west-004   # غيّرها حسب منطقتك
        run: |
          aws s3 cp backup.dump \
            "s3://${{ secrets.B2_BUCKET_NAME }}/backup-$(date +%Y-%m-%d-%H%M).dump" \
            --endpoint-url "${{ secrets.B2_ENDPOINT }}"
