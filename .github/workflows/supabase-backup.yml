name: Supabase Backup

on:
  schedule:
    - cron: '0 2 * * *'   # كل يوم 2 الصبح UTC
  workflow_dispatch:       # لتشغيله يدوي للتجربة

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges -F c -f backup.dump
          ls -lh backup.dump

      - name: Upload to Backblaze B2
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          AWS_DEFAULT_REGION: us-west-004   # غيّرها حسب منطقتك
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          export AWS_ACCESS_KEY_ID="$(printf '%s' "$B2_KEY_ID" | tr -d '[:space:]')"
          export AWS_SECRET_ACCESS_KEY="$(printf '%s' "$B2_APPLICATION_KEY" | tr -d '[:space:]')"
          BUCKET="$(printf '%s' "$B2_BUCKET_NAME" | tr -d '[:space:]')"
          ENDPOINT="$(printf '%s' "$B2_ENDPOINT" | tr -d '[:space:]')"

          aws s3 cp backup.dump \
            "s3://${BUCKET}/backup-$(date +%Y-%m-%d-%H%M).dump" \
            --endpoint-url "$ENDPOINT"
