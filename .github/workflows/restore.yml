name: Supabase Restore

on:
  workflow_dispatch:
    inputs:
      backup_file:
        description: 'اسم الملف في الـ Bucket (مثل backup-2026-11-09-1128.dump)'
        required: true
      confirm:
        description: 'اكتب RESTORE للتأكيد'
        required: true

jobs:
  restore:
    if: ${{ inputs.confirm == 'RESTORE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install PostgreSQL 17 client
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Download backup from B2
        timeout-minutes: 10
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          export AWS_ACCESS_KEY_ID="$(printf '%s' "$B2_KEY_ID" | tr -d '[:space:]')"
          export AWS_SECRET_ACCESS_KEY="$(printf '%s' "$B2_APPLICATION_KEY" | tr -d '[:space:]')"
          BUCKET="$(printf '%s' "$B2_BUCKET_NAME" | tr -d '[:space:]')"
          ENDPOINT="$(printf '%s' "$B2_ENDPOINT" | tr -d '[:space:]')"
          export AWS_DEFAULT_REGION="$(echo "$ENDPOINT" | sed -E 's#https?://s3\.([^.]+)\.backblazeb2\.com.*#\1#')"

          aws s3 cp "s3://${BUCKET}/${{ inputs.backup_file }}" backup.dump \
            --endpoint-url "$ENDPOINT"
          ls -lh backup.dump

      - name: Restore database
        timeout-minutes: 30
        env:
          RESTORE_DB_URL: ${{ secrets.SUPABASE_RESTORE_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/pg_restore \
            --no-owner --no-privileges \
            --clean --if-exists \
            --schema=public \
            --verbose -j 4 \
            -d "$RESTORE_DB_URL" backup.dump
