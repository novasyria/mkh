name: Nova Store EMERGENCY Restore

on:
  workflow_dispatch:
    inputs:
      restore_date:
        description: 'تاريخ النسخة (YYYY-MM-DD)'
        required: true
        type: string
      confirm:
        description: 'اكتب YES للتأكيد'
        required: true
        type: string

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: التحقق من التأكيد
        if: inputs.confirm != 'YES' && inputs.confirm != 'yes'
        run: |
          echo "❌ تم الإلغاء — لازم تكتب YES بالضبط للتشغيل"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تثبيت المكتبات
        run: npm install

      - name: تشغيل الاسترجاع
        run: node restore.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_REGION: ${{ secrets.B2_REGION }}
          RESTORE_DATE: ${{ inputs.restore_date }}
          RESTORE_CONFIRM: ${{ inputs.confir
