      - name: Upload to Backblaze B2
        env:
          RAW_KEY_ID: ${{ secrets.B2_KEY_ID }}
          RAW_APP_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          RAW_REGION: ${{ secrets.B2_REGION }}
          RAW_BUCKET: ${{ secrets.B2_BUCKET }}
          RAW_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          export AWS_ACCESS_KEY_ID="$(clean "$RAW_KEY_ID")"
          export AWS_SECRET_ACCESS_KEY="$(clean "$RAW_APP_KEY")"
          export AWS_DEFAULT_REGION="$(clean "$RAW_REGION")"
          B2_BUCKET="$(clean "$RAW_BUCKET")"
          B2_ENDPOINT="$(clean "$RAW_ENDPOINT")"
          if [ -z "$B2_BUCKET" ]; then echo "B2_BUCKET is empty"; exit 1; fi
          aws s3 cp "$FILE" "s3://$B2_BUCKET/daily/$FILE" --endpoint-url "$B2_ENDPOINT"
          echo "Uploaded $FILE"
