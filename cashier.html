<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUQTH - الكاشير</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#d4af37">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="NUQTH">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2 https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js; style-src 'unsafe-inline'; manifest-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self'; connect-src https://ofylogxewabdiemaifep.supabase.co wss://ofylogxewabdiemaifep.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- قارئ QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script>
        // بديل في حال تعذر تحميل المكتبة من cdnjs
        if (typeof Html5Qrcode === "undefined") {
            document.write('<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"><\/script>');
        }
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { min-height: 100vh; background: #0b0b0b; color: white; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .cashier-card { width: 100%; max-width: 420px; background: #151515; border: 1px solid #d4af37; border-radius: 24px; padding: 30px 22px; text-align: center; box-shadow: 0 10px 40px rgba(212,175,55,0.15); }
        .logo { width: 65px; height: 65px; margin: 0 auto 18px; border-radius: 50%; background: #d4af37; color: #111; display: flex; justify-content: center; align-items: center; font-size: 26px; font-weight: bold; }
        h1 { color: #d4af37; margin-bottom: 10px; }
        .description { color: #aaa; font-size: 14px; margin-bottom: 22px; }
        input[type="text"], input[type="number"] { width: 100%; padding: 15px; background: #202020; color: white; border: 1px solid #333; border-radius: 12px; outline: none; font-size: 16px; margin-bottom: 14px; text-align: center; }
        input[type="text"]:focus, input[type="number"]:focus { border-color: #d4af37; }
        button { width: 100%; padding: 15px; background: #d4af37; color: #111; border: none; border-radius: 12px; font-size: 17px; font-weight: bold; cursor: pointer; margin-bottom: 12px; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        #reader { display: none; width: 100%; margin: 18px auto; border: 1px solid #333; border-radius: 16px; overflow: hidden; }
        #reader video { width: 100%; border-radius: 16px; }
        .divider { margin: 8px 0 18px; color: #777; font-size: 14px; }
        .customer { margin-top: 25px; background: #1d1d1d; border: 1px solid #333; border-radius: 18px; padding: 20px; text-align: right; }
        .customer h2 { color: #d4af37; margin-bottom: 15px; text-align: center; font-size: 18px; }
        .customer p { margin-bottom: 10px; color: #ddd; font-size: 14px; }
        .reward { margin-top: 18px; padding: 15px; background: #2a210c; border: 1px solid #d4af37; border-radius: 14px; color: #d4af37; text-align: center; font-weight: bold; }
        .error { margin-top: 20px; color: #ff7777; font-size: 15px; text-align: center; }
        .success { margin-top: 10px; color: #76e39b; font-size: 15px; text-align: center; }
        .project { color: #d4af37; font-weight: bold; text-align: center; margin-bottom: 15px; }
        .back-link { display: inline-block; margin-top: 18px; color: #ddd; background: #333; border: 1px solid #444; border-radius: 8px; padding: 7px 11px; text-decoration: none; font-size: 12px; }
        .stop-link { display: block; margin: -4px 0 14px; color: #ff9b9b; font-size: 13px; text-decoration: underline; }
        .camera-hint { color: #ffd76a; background: #4a3b00; border: 1px solid #d4af37; border-radius: 10px; padding: 10px; font-size: 12px; margin-bottom: 12px; text-align: center; line-height: 1.7; }
    </style>
</head>

<body>

    <main class="cashier-card">
        <div class="logo">N</div>
        <h1>لوحة الكاشير</h1>
        <p class="description">امسح QR العميل للوصول إلى بطاقته.</p>

        <!-- زر المسح -->
        <button id="scanButton" type="button">📷 مسح QR بالكاميرا</button>
        <button id="galleryButton" type="button">🖼️ اختيار صورة من المعرض</button>
        <div style="color:#888;font-size:12px;margin:-2px 0 12px;line-height:1.6;">
            امسح الباركود بالكاميرا مباشرة، أو اختر صورة الباركود من معرض هاتفك.
        </div>
        <div id="reader"></div>
        <a id="stopScanButton" class="stop-link" href="#" style="display:none;">إيقاف الكاميرا</a>

        <div id="cameraHint" class="camera-hint" style="display:none;"></div>

        <!-- حقل مخفي: يفتح كاميرا الجهاز (بدون صلاحيات) -->
        <input
            type="file"
            id="qrImage"
            accept="image/*"
            capture
            style="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;"
        >

        <!-- حقل مخفي: اختيار صورة من المعرض (بدون capture) -->
        <input
            type="file"
            id="qrGallery"
            accept="image/*"
            style="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;"
        >

        <div id="qrFileReader" style="display:none;"></div>

        <div class="divider">أو</div>

        <!-- إدخال يدوي -->
        <input type="text" id="memberID" placeholder="أدخل رقم العضوية" autocomplete="off" maxlength="80">
        <button id="searchButton" type="button">البحث عن العميل</button>

        <!-- النتيجة -->
        <div id="customerResult"></div>

        <a id="cashierLogoutLink" class="back-link" href="index.html">تسجيل خروج</a>
    </main><script>
        // ---- بوابة الدخول: لا تفتح الصفحة بدون تسجيل دخول من index.html ----
        (function () {
            var ok = false;
            try {
                var code = new URLSearchParams(location.search).get('project') || '';
                var saved = localStorage.getItem('k_loyalty_saved_dest');
                var access = localStorage.getItem('k_loyalty_access_code');
                if (code && saved && access) {
                    var u = new URL(saved, location.href);
                    ok = /\/cashier\.html$/.test(u.pathname) && u.searchParams.get('project') === code;
                }
            } catch (e) { ok = false; }
            if (!ok) {
                location.replace('index.html');
                throw new Error('unauthorized');
            }
        })();

        // =================================================
        // SUPABASE
        // =================================================
        const SUPABASE_URL = "https://ofylogxewabdiemaifep.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_UzOHSK-Jk_5KVVu0TEcFxQ_bOjlAgFQ";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // رمز الكاشير السري (يُستخدم للتحقق منه في السيرفر مع كل طلب)
        const ACCESS_CODE_KEY = "k_loyalty_access_code";
        const accessCode = localStorage.getItem(ACCESS_CODE_KEY) || "";

        function logoutAndRedirect() {
            try {
                localStorage.removeItem(ACCESS_CODE_KEY);
                localStorage.removeItem("k_loyalty_saved_dest");
            } catch (e) {}
            window.location.replace("index.html");
        }

        document.getElementById("cashierLogoutLink").addEventListener("click", function () {
            localStorage.removeItem("k_loyalty_saved_dest");
            localStorage.removeItem(ACCESS_CODE_KEY);
        });

        // لا نسمح بالعمل قبل التأكد من صلاحية الرمز على السيرفر
        async function verifyCashierAccess() {
            if (!accessCode || !currentProjectCode || !db) {
                logoutAndRedirect();
                return false;
            }

            try {
                const { data, error } = await db.rpc("app_login", { p_code: accessCode });
                if (error) throw error;
                const auth = data || {};
                if (auth.ok !== true || auth.role !== "cashier" || auth.store_code !== currentProjectCode) {
                    logoutAndRedirect();
                    return false;
                }
                return true;
            } catch (e) {
                console.error("Access verification failed:", e);
                logoutAndRedirect();
                return false;
            }
        }

        // =================================================
        // العناصر
        // =================================================
        const memberIDInput = document.getElementById("memberID");
        const searchButton = document.getElementById("searchButton");
        const scanButton = document.getElementById("scanButton");
        const stopScanButton = document.getElementById("stopScanButton");
        const cameraHint = document.getElementById("cameraHint");
        const qrImage = document.getElementById("qrImage");
        const qrGallery = document.getElementById("qrGallery");
        const galleryButton = document.getElementById("galleryButton");
        const qrFileReader = document.getElementById("qrFileReader");
        const reader = document.getElementById("reader");
        const customerResult = document.getElementById("customerResult");

        let qrScanner = null;
        let fileScanner = null;
        let scanning = false;
        let scannerStarting = false;

        // داخل تطبيقات الويب فيو (appcreator24) لا تعمل الكاميرا المباشرة،
        // لذلك نفتح كاميرا الجهاز من حقل الصورة.
        function isEmbeddedWebView() {
            var ua = navigator.userAgent || "";
            if (/;\s*wv\)/i.test(ua)) return true;          // WebView قياسي
            if (/appcreator/i.test(ua)) return true;
            if (/FBAN|FBAV|Instagram|Line\//i.test(ua)) return true;
            // علامة WebView: وجود Version/x مع Android وبدون Chrome/كامل
            if (/Android/i.test(ua) && /Version\/\d/i.test(ua)) return true;
            return false;
        }

        const directCameraBlocked =
            !window.isSecureContext ||
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia ||
            isEmbeddedWebView();

        // =================================================
        // أدوات الكاميرا
        // =================================================

        function setCameraUi(active) {
            reader.style.display = active ? "block" : "none";
            scanButton.style.display = active ? "none" : "block";
            stopScanButton.style.display = active ? "block" : "none";
        }

        // فتح كاميرا الجهاز عبر حقل الصورة.
        // ملاحظة: الخاصية capture تُكتب بدون قيمة (capture) لأن هذه الصيغة
        // هي الأكثر توافقاً مع WebView على أندرويد.
        let cameraOpenedAt = 0;

        function openDeviceCamera() {
            cameraOpenedAt = Date.now();

            try {
                if (qrImage.getAttribute("capture") === null) {
                    qrImage.setAttribute("capture", "");
                }
            } catch (e) {}

            try {
                qrImage.click();
            } catch (e) {
                showCameraHelp();
            }
        }

        function showCameraHelp() {
            var mode = isEmbeddedWebView() ? "داخل التطبيق" : "في المتصفح";
            cameraHint.innerHTML =
                "إذا فُتح معرض الصور بدل الكاميرا: اضغط أيقونة الكاميرا 📷 داخل شاشة المعرض، " +
                "أو صوّر رمز QR بكاميرا الهاتف ثم اختر الصورة من المعرض." +
                "<br><span style='color:#c9b26a;font-size:11px;'>(" +
                mode +
                " — كاميرا الويب غير متاحة)</span>" +
                "<br><a href='" + location.href + "' target='_blank' rel='noopener' " +
                "style='display:inline-block;margin-top:8px;color:#d4af37;font-weight:bold;'>" +
                "فتح المسح في متصفح كروم ↗</a>";
            cameraHint.style.display = "block";
        }

        // عند العودة من شاشة التصوير بدون اختيار صورة نعرض الإرشاد
        window.addEventListener("focus", function () {
            if (!cameraOpenedAt) return;
            var started = cameraOpenedAt;
            window.setTimeout(function () {
                if (started !== cameraOpenedAt) return;
                if (qrImage.files && qrImage.files.length > 0) return;
                if (Date.now() - started > 120000) return;
                showCameraHelp();
            }, 1200);
        });

        function ensureHtml5Qrcode() {
            if (typeof Html5Qrcode !== "undefined") {
                return Promise.resolve(true);
            }

            return new Promise(function (resolve, reject) {
                const script = document.createElement("script");
                script.src = "https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js";
                script.onload = function () {
                    resolve(typeof Html5Qrcode !== "undefined");
                };
                script.onerror = function () {
                    reject(new Error("library"));
                };
                document.head.appendChild(script);
            });
        }

        // معرفة المشروع من الرابط إن وجد
        const urlParams = new URLSearchParams(window.location.search);
        const currentProjectCode = urlParams.get('project');

        // إعدادات الولاء تأتي مع نتيجة البحث من السيرفر (لا قراءة مباشرة للجداول)

        // =================================================
        // رسالة خطأ
        // =================================================
        // تعقيم النصوص قبل عرضها (يمنع حقن أكواد من اسم/هاتف العميل)
        function esc(value) {
            return String(value == null ? "" : value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function showError(message) {
            customerResult.innerHTML = '<div class="error">' + esc(message) + '</div>';
        }

        // رسالة داخل بطاقة العميل (لا تمسح الأزرار)
        function setActionMessage(message, ok) {
            const el = document.getElementById("actionMessage");
            if (!el) {
                if (message) showError(message);
                return;
            }
            el.className = ok ? "success" : "error";
            el.textContent = message || "";
        }

        // =================================================
        // تحليل QR
        // =================================================
        function parseQR(qrText) {
            qrText = qrText.trim();
            if (qrText.includes("|")) {
                const parts = qrText.split("|");
                const storeCode = parts[0].trim();
                const memberID = parts[1].trim();

                if (!storeCode || !memberID) {
                    return null;
                }
                return { storeCode: storeCode, memberID: memberID };
            }

            return {
                storeCode: currentProjectCode || null,
                memberID: qrText
            };
        }

        // =================================================
        // البحث عن العميل
        // =================================================
        async function findCustomer(value) {
            value = value.trim();
            if (!value) {
                showError("يرجى إدخال أو مسح رقم العضوية.");
                return;
            }

            customerResult.innerHTML = "<div style='padding:15px;color:#d4af37;'>جاري البحث...</div>";

            try {
                const qrData = parseQR(value);
                if (!qrData) {
                    showError("رمز QR غير صحيح.");
                    return;
                }

                // الكاشير يتعامل فقط مع عملاء مشروعه
                if (currentProjectCode && qrData.storeCode && qrData.storeCode !== currentProjectCode) {
                    showError("هذه البطاقة لا تتبع هذا المشروع.");
                    return;
                }

                const storeForRequest = qrData.storeCode || currentProjectCode;

                if (!storeForRequest) {
                    showError("تعذر تحديد المشروع.");
                    return;
                }

                // كل التحقق من الرمز والبيانات يتم داخل قاعدة البيانات
                const lookup = await db.rpc("cashier_lookup", {
                    p_code: accessCode,
                    p_store_code: storeForRequest,
                    p_member_id: qrData.memberID
                });

                if (lookup.error) {
                    console.error(lookup.error);
                    showError("حدث خطأ أثناء البحث. حاول مرة أخرى.");
                    return;
                }

                const payload = lookup.data || {};

                if (!payload.ok) {
                    if (payload.error === "unauthorized") {
                        logoutAndRedirect();
                        return;
                    }
                    if (payload.error === "not_found") {
                        showError("لم يتم العثور على العميل.");
                        return;
                    }
                    showError("حدث خطأ أثناء البحث. حاول مرة أخرى.");
                    return;
                }

                await showCustomer(payload.customer, payload.settings);
            } catch (error) {
                console.error(error);
                showError("حدث خطأ. حاول مرة أخرى.");
            }
        }

        // =================================================
        // عرض العميل
        // =================================================
        async function showCustomer(customer, settings) {
            settings = settings || {};

            // إعدادات السيرفر مع قيم افتراضية آمنة
            settings = {
                pointsPerVisit: Number(settings.pointsPerVisit) || 10,
                rewardPoints: Number(settings.rewardPoints) || 40,
                rewardName: settings.rewardName || "خصم 10%",
                pointsCycleDays: Number(settings.pointsCycleDays) || 0
            };
            const visits = Number(customer.visits || 0);
            const points = Number(customer.points || 0);
            const rewardPoints = settings.rewardPoints;
            const cycleDays = settings.pointsCycleDays;

            // عداد النقاط للوصول إلى المكافأة
            const progress = Math.min(points, rewardPoints);
            const progressPercent = rewardPoints > 0 ? Math.round((progress / rewardPoints) * 100) : 0;

            // الأيام المتبقية في دورة النقاط (0 = بدون دورة)
            let cycleHTML = "";
            if (cycleDays > 0) {
                let daysLeft = cycleDays;
                if (customer.period_start) {
                    const start = new Date(customer.period_start);
                    const elapsed = Math.floor((Date.now() - start.getTime()) / (1000 * 60 * 60 * 24));
                    daysLeft = Math.max(0, cycleDays - elapsed);
                }
                cycleHTML =
                    '<div style="color:#ffd76a;font-size:12px;margin-top:8px;">' +
                    '⏳ متبقي ' + daysLeft + ' يوم على تصفير النقاط (دورة ' + cycleDays + ' يوم)' +
                    '</div>';
            }

            const progressHTML =
                '<div style="margin-top:12px;background:#202020;border-radius:10px;padding:10px;">' +
                '<div style="color:#d4af37;font-weight:bold;margin-bottom:8px;">🎯 نقاط المكافأة</div>' +
                '<div style="display:flex;justify-content:space-between;color:#ddd;font-size:13px;margin-bottom:6px;">' +
                '<span>النقاط الحالية: ' + points + ' / ' + rewardPoints + '</span>' +
                '<span>' + esc(settings.rewardName) + '</span>' +
                '</div>' +
                '<div style="background:#111;border-radius:8px;height:14px;overflow:hidden;">' +
                '<div style="background:' + (progress >= rewardPoints ? '#28a745' : '#d4af37') + ';height:100%;width:' + progressPercent + '%;border-radius:8px;transition:width .3s;"></div>' +
                '</div>' +
                cycleHTML +
                '</div>';

            const hasReward = points >= rewardPoints;
            const rewardHTML = hasReward
                ? '<div class="reward">' +
                    '🎉 العميل يستحق مكافأة!' +
                    '<br><br>' +
                    '<strong>' + esc(settings.rewardName) + '</strong>' +
                    '<button type="button" style="margin-top:12px;" id="useRewardButton">' +
                    'استخدام المكافأة' +
                    '</button>' +
                    '</div>'
                : "";

            const name = esc(customer.name || "بدون اسم");
            const phone = esc(customer.phone || "غير مسجل");
            const storeCode = esc(customer.store_code || "-");

            customerResult.innerHTML =
                '<div class="customer">' +
                '<h2>بيانات العميل</h2>' +
                '<div class="project">المشروع: ' + storeCode + '</div>' +
                '<p><strong>الاسم:</strong> ' + name + '</p>' +
                '<p><strong>رقم العضوية:</strong> ' + esc(customer.member_id) + '</p>' +
                '<p><strong>الهاتف:</strong> ' + phone + '</p>' +
                '<p><strong>إجمالي الزيارات:</strong> ' + visits + '</p>' +
                '<p><strong>النقاط:</strong> ' + points + '</p>' +
                progressHTML +
                rewardHTML +
                '<label for="pointsAwardInput" style="display:block;color:#ccc;margin:14px 0 6px;font-size:14px;">النقاط الممنوحة لهذه الزيارة</label>' +
                '<input type="number" id="pointsAwardInput" min="1" max="100000" step="1" required value="' + settings.pointsPerVisit + '">' +
                '<button type="button" style="margin-top:10px;" id="addVisitButton">' +
                'تسجيل زيارة' +
                '</button>' +
                '<div id="actionMessage"></div>' +
                '</div>';

            // =========================================
            // تسجيل زيارة
            // =========================================
            const addVisitButton = document.getElementById("addVisitButton");
            const pointsAwardInput = document.getElementById("pointsAwardInput");
            addVisitButton.onclick = async function () {
                const pointsToAward = Number(pointsAwardInput.value);
                if (!pointsAwardInput.reportValidity() || !Number.isSafeInteger(pointsToAward) || pointsToAward < 1 || pointsToAward > 100000) {
                    return;
                }

                this.disabled = true;
                this.innerText = "جاري الحفظ...";

                try {
                    // الحساب والتحديث يتمّان داخل قاعدة البيانات (يمنع التلاعب والسباق)
                    const result = await db.rpc("cashier_add_visit", {
                        p_code: accessCode,
                        p_store_code: customer.store_code || currentProjectCode,
                        p_member_id: customer.member_id,
                        p_points: pointsToAward
                    });

                    if (result.error) throw result.error;

                    const payload = result.data || {};

                    if (!payload.ok) {
                        if (payload.error === "unauthorized") {
                            logoutAndRedirect();
                            return;
                        }

                        this.disabled = false;
                        this.innerText = "تسجيل زيارة";

                        if (payload.error === "points_limit" || payload.error === "visits_limit") {
                            setActionMessage("تعذر تحديث البيانات بسبب تجاوز الحد المسموح.", false);
                            return;
                        }
                        if (payload.error === "not_found") {
                            setActionMessage("لم يتم العثور على العميل.", false);
                            return;
                        }
                        setActionMessage("تعذر تحديث البيانات. حاول مرة أخرى.", false);
                        return;
                    }

                    await showCustomer(payload.customer, payload.settings);
                    setActionMessage("تم تسجيل الزيارة بنجاح ✅", true);
                } catch (error) {
                    console.error(error);
                    this.disabled = false;
                    this.innerText = "تسجيل زيارة";
                    setActionMessage("تعذر تحديث البيانات. حاول مرة أخرى.", false);
                }
            };// =========================================
            // استخدام المكافأة
            // =========================================
            const useRewardButton = document.getElementById("useRewardButton");
            if (useRewardButton) {
                useRewardButton.onclick = async function () {
                    this.disabled = true;
                    this.innerText = "جاري استخدام المكافأة...";

                    try {
                        const result = await db.rpc("cashier_redeem", {
                            p_code: accessCode,
                            p_store_code: customer.store_code || currentProjectCode,
                            p_member_id: customer.member_id
                        });

                        if (result.error) throw result.error;

                        const payload = result.data || {};

                        if (!payload.ok) {
                            if (payload.error === "unauthorized") {
                                logoutAndRedirect();
                                return;
                            }

                            this.disabled = false;
                            this.innerText = "استخدام المكافأة";

                            if (payload.error === "no_reward") {
                                setActionMessage("لا توجد مكافأة مستحقة حالياً.", false);
                                return;
                            }
                            setActionMessage("تعذر استخدام المكافأة.", false);
                            return;
                        }

                        await showCustomer(payload.customer, payload.settings);
                        setActionMessage("تم استخدام المكافأة بنجاح ✅", true);
                    } catch (error) {
                        console.error(error);
                        this.disabled = false;
                        this.innerText = "استخدام المكافأة";
                        setActionMessage("تعذر استخدام المكافأة.", false);
                    }
                };
            }
        }

        // =================================================
        // البحث اليدوي
        // =================================================
        searchButton.onclick = function () {
            findCustomer(memberIDInput.value);
        };

        memberIDInput.onkeypress = function(e) {
            if (e.key === 'Enter') {
                findCustomer(memberIDInput.value);
            }
        };

        // =================================================
        // إيقاف الكاميرا
        // =================================================
        async function stopScanner() {
            scanning = false;

            const current = qrScanner;
            qrScanner = null;

            if (current) {
                try {
                    await current.stop();
                } catch (e) {
                    console.warn(e);
                }
                try {
                    current.clear();
                } catch (e) {
                    console.warn(e);
                }
            }

            setCameraUi(false);
            scanButton.disabled = false;
            scanButton.textContent = "📷 مسح QR بالكاميرا";
        }

        // =================================================
        // تشغيل الكاميرا
        // =================================================
        async function startScanner() {
            if (scanning || scannerStarting) return;

            scannerStarting = true;
            showError("");

            try {
                if (!window.isSecureContext) {
                    throw new Error("insecure");
                }

                const loaded = await ensureHtml5Qrcode();
                if (!loaded) {
                    throw new Error("library");
                }

                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error("insecure");
                }

                setCameraUi(true);
                scanning = true;
                scanButton.disabled = true;
                scanButton.textContent = "📷 جاري فتح الكاميرا...";

                const config = {
                    fps: 15,
                    qrbox: function (width, height) {
                        const size = Math.floor(Math.min(width, height) * 0.72);
                        return { width: size, height: size };
                    },
                    aspectRatio: 1.0,
                    disableFlip: false
                };

                const onScan = async function (decodedText) {
                    if (!scanning) return;
                    await stopScanner();
                    cameraHint.style.display = "none";
                    memberIDInput.value = decodedText;
                    findCustomer(decodedText);
                };

                function createScanner() {
                    return new Html5Qrcode("reader", {
                        verbose: false,
                        experimentalFeatures: {
                            useBarCodeDetectorIfSupported: true
                        }
                    });
                }

                qrScanner = createScanner();

                try {
                    await qrScanner.start(
                        { facingMode: "environment" },
                        config,
                        onScan,
                        function () {}
                    );
                } catch (firstError) {
                    // بعض الأجهزة (لابتوب / كاميرا واحدة) لا تدعم facingMode
                    console.warn("environment camera failed, trying another camera:", firstError);

                    let cameraId = null;

                    try {
                        const cameras = await Html5Qrcode.getCameras();
                        if (cameras && cameras.length) {
                            cameraId = cameras[0].id;
                        }
                    } catch (camError) {
                        console.warn(camError);
                    }

                    if (!cameraId) {
                        throw firstError;
                    }

                    if (qrScanner) {
                        try { await qrScanner.stop(); } catch (e) {}
                        try { qrScanner.clear(); } catch (e) {}
                    }

                    qrScanner = createScanner();

                    await qrScanner.start(
                        cameraId,
                        config,
                        onScan,
                        function () {}
                    );
                }
            } catch (error) {
                console.error(error);
                await stopScanner();

                if (String(error && error.message) === "library") {
                    showError("تعذر تحميل مكتبة قارئ QR. تحقق من الإنترنت ثم أعد المحاولة.");
                } else {
                    // الكاميرا المباشرة ممنوعة هنا ⇒ ننتقل لكاميرا الجهاز
                    showError("");
                    showCameraHelp();
                    openDeviceCamera();
                }
            } finally {
                scannerStarting = false;

                if (!scanning) {
                    scanButton.disabled = false;
                    scanButton.textContent = "📷 مسح QR بالكاميرا";
                }
            }
        }

        scanButton.onclick = function () {
            if (directCameraBlocked) {
                openDeviceCamera();
                return;
            }
            startScanner();
        };

        stopScanButton.onclick = function (event) {
            event.preventDefault();
            stopScanner();
        };

        // إيقاف الكاميرا عند مغادرة الصفحة
        window.addEventListener("pagehide", function () {
            if (scanning) {
                stopScanner();
            }
        });

        // =================================================
        // قراءة QR من صورة
        // =================================================
        async function scanImageFile(file) {
            if (!file) return;

            showError("");
            customerResult.innerHTML = "<div style='padding:15px;color:#d4af37;'>جاري قراءة QR...</div>";

            try {
                const loaded = await ensureHtml5Qrcode();
                if (!loaded) {
                    throw new Error("library");
                }

                if (fileScanner) {
                    try { fileScanner.clear(); } catch (e) {}
                    fileScanner = null;
                }

                fileScanner = new Html5Qrcode("qrFileReader", { verbose: false });

                const decodedText = await fileScanner.scanFile(file, true);

                try { fileScanner.clear(); } catch (e) {}
                fileScanner = null;

                memberIDInput.value = decodedText;
                await findCustomer(decodedText);
            } catch (error) {
                console.error(error);

                if (fileScanner) {
                    try { fileScanner.clear(); } catch (e) {}
                    fileScanner = null;
                }

                if (String(error && error.message) === "library") {
                    showError("تعذر تحميل مكتبة قارئ QR. تحقق من الإنترنت ثم أعد المحاولة.");
                } else {
                    showError("لم يتم العثور على QR واضح في الصورة. جرّب صورة أقرب وأوضح.");
                }
            }
        }

        qrImage.onchange = function (event) {
            const file = event.target.files[0];
            cameraOpenedAt = 0;
            qrImage.value = "";
            if (file) {
                cameraHint.style.display = "none";
                scanImageFile(file);
            }
        };

        // اختيار صورة QR من معرض الصور (بدون فتح الكاميرا)
        galleryButton.onclick = function () {
            cameraHint.style.display = "none";
            try {
                qrGallery.click();
            } catch (e) {}
        };

        qrGallery.onchange = function (event) {
            const file = event.target.files[0];
            qrGallery.value = "";
            if (file) {
                cameraHint.style.display = "none";
                scanImageFile(file);
            }
        };

        // التحقق من رمز الكاشير على السيرفر قبل بدء العمل
        verifyCashierAccess();
    </script>
